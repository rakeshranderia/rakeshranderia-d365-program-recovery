<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440">
<style>
  .t { font-family: Arial, sans-serif; fill:#17365D; }
  .h { font-size:18px; font-weight:700; }
  .s { font-size:12px; }
  .box { fill:#EAF0F7; stroke:#2F5597; stroke-width:2; rx:10; }
  .dark { fill:#17365D; stroke:#17365D; stroke-width:2; rx:10; }
  .white { fill:white; font-family:Arial, sans-serif; font-size:12px; font-weight:700; }
  .arrow { stroke:#2F5597; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2F5597"/>
  </marker>
</defs>
<text x="20" y="32" class="t h">Program governance and communication model</text>
<rect x="110" y="60" width="900" height="54" class="dark"/>
<text x="128" y="83" style="font-family:Arial,sans-serif;font-size:13px;font-weight:700;fill:white">Executive / SteerCo</text>
<text x="128" y="101" style="font-family:Arial,sans-serif;font-size:11px;fill:white">Scope | budget | risk acceptance | escalations</text>
<rect x="125" y="132" width="870" height="54" class="box"/>
<text x="143" y="155" style="font-family:Arial,sans-serif;font-size:13px;font-weight:700;fill:#17365D">Program governance</text>
<text x="143" y="173" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">RACI | RAID | decision log | milestones | change control</text>
<rect x="140" y="204" width="840" height="54" class="box"/>
<text x="158" y="227" style="font-family:Arial,sans-serif;font-size:13px;font-weight:700;fill:#17365D">Delivery workstreams</text>
<text x="158" y="245" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Business | technology | vendors | integrations | data</text>
<rect x="155" y="276" width="810" height="54" class="box"/>
<text x="173" y="299" style="font-family:Arial,sans-serif;font-size:13px;font-weight:700;fill:#17365D">Change & adoption</text>
<text x="173" y="317" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">End-user communications | training | champions | remote staff</text>
<rect x="170" y="348" width="780" height="54" class="dark"/>
<text x="188" y="371" style="font-family:Arial,sans-serif;font-size:13px;font-weight:700;fill:white">BAU transition</text>
<text x="188" y="389" style="font-family:Arial,sans-serif;font-size:11px;fill:white">SLAs | support | contracts | reporting | backlog | optimisation</text>
