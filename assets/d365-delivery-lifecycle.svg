<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="180" viewBox="0 0 1140 180">
<style>
  .t { font-family: Arial, sans-serif; fill:#17365D; }
  .h { font-size:18px; font-weight:700; }
  .s { font-size:12px; }
  .box { fill:#EAF0F7; stroke:#2F5597; stroke-width:2; rx:10; }
  .dark { fill:#17365D; stroke:#17365D; stroke-width:2; rx:10; }
  .white { fill:white; font-family:Arial, sans-serif; font-size:12px; font-weight:700; }
  .arrow { stroke:#2F5597; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2F5597"/>
  </marker>
</defs>
<text x="20" y="32" class="t h">D365 delivery lifecycle</text>
<rect x="20" y="70" width="120" height="72" class="dark"/>
<text x="80.0" y="95" text-anchor="middle" class="white" style="font-weight:700;font-size:13px">Discover</text>
<text x="80.0" y="115" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:white">Business problem</text>
<text x="80.0" y="130" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:white">Stakeholders</text>
<line x1="142" y1="106.0" x2="158" y2="106.0" class="arrow"/>
<rect x="160" y="70" width="120" height="72" class="box"/>
<text x="220.0" y="95" text-anchor="middle" class="t" style="font-weight:700;font-size:13px">Define</text>
<text x="220.0" y="115" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Requirements</text>
<text x="220.0" y="130" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Scope / MVP</text>
<line x1="282" y1="106.0" x2="298" y2="106.0" class="arrow"/>
<rect x="300" y="70" width="120" height="72" class="box"/>
<text x="360.0" y="95" text-anchor="middle" class="t" style="font-weight:700;font-size:13px">Design</text>
<text x="360.0" y="115" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">D365 / data</text>
<text x="360.0" y="130" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Integration</text>
<line x1="422" y1="106.0" x2="438" y2="106.0" class="arrow"/>
<rect x="440" y="70" width="120" height="72" class="box"/>
<text x="500.0" y="95" text-anchor="middle" class="t" style="font-weight:700;font-size:13px">Build</text>
<text x="500.0" y="115" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Config / migration</text>
<text x="500.0" y="130" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Vendor delivery</text>
<line x1="562" y1="106.0" x2="578" y2="106.0" class="arrow"/>
<rect x="580" y="70" width="120" height="72" class="box"/>
<text x="640.0" y="95" text-anchor="middle" class="t" style="font-weight:700;font-size:13px">Validate</text>
<text x="640.0" y="115" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">UAT / OAT</text>
<text x="640.0" y="130" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Readiness</text>
<line x1="702" y1="106.0" x2="718" y2="106.0" class="arrow"/>
<rect x="720" y="70" width="120" height="72" class="box"/>
<text x="780.0" y="95" text-anchor="middle" class="t" style="font-weight:700;font-size:13px">Deploy</text>
<text x="780.0" y="115" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Cutover</text>
<text x="780.0" y="130" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Go-live</text>
<line x1="842" y1="106.0" x2="858" y2="106.0" class="arrow"/>
<rect x="860" y="70" width="120" height="72" class="box"/>
<text x="920.0" y="95" text-anchor="middle" class="t" style="font-weight:700;font-size:13px">Stabilise</text>
<text x="920.0" y="115" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Hypercare</text>
<text x="920.0" y="130" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:#17365D">Remediation</text>
<line x1="982" y1="106.0" x2="998" y2="106.0" class="arrow"/>
<rect x="1000" y="70" width="120" height="72" class="dark"/>
<text x="1060.0" y="95" text-anchor="middle" class="white" style="font-weight:700;font-size:13px">Operate</text>
<text x="1060.0" y="115" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:white">BAU / SLAs</text>
<text x="1060.0" y="130" text-anchor="middle" style="font-family:Arial,sans-serif;font-size:11px;fill:white">Optimisation</text>
</svg>